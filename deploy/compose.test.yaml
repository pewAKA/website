services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: personal_website_test
      MYSQL_USER: website_test
      MYSQL_PASSWORD: website_test_password
      MYSQL_ROOT_PASSWORD: root_test_password
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:3308:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uwebsite_test', '-pwebsite_test_password']
      interval: 2s
      timeout: 3s
      retries: 30

