server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 保留 /api 前缀，使前端 VITE_API_BASE_URL=/api 无需额外配置。
    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 此路径必须与 APP_MEDIA_HOST_PATH 指向同一宿主机目录。
    location /media/ {
        alias /var/lib/personal-website/uploads/;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }

    # 让搜索引擎在站点根路径读取动态生成的文章 sitemap。
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080/api/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 其余页面交给 Next.js standalone 服务处理 SSR 与静态路由。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
